subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.lifecycle' && details.requested.name == 'lifecycle-process') {
                details.useVersion '2.7.0'
            }
            if (details.requested.group == 'androidx.lifecycle' && details.requested.name == 'lifecycle-viewmodel-savedstate') {
                details.useVersion '2.7.0'
            }
        }
    }
}
